version: '3'

services:
  front:
    build: ./front
    working_dir: /front
    container_name: front
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./front:/front
      - front_node_modules:/front/node_modules
    command: npm run dev -- --host 0.0.0.0
    networks:
      - app-network

  server:
    build: ./server
    working_dir: /server
    container_name: server
    restart: always
    depends_on:
      - mongo
    ports:
      - "3000:3000"
    volumes:
      - ./server:/server
      - server_node_modules:/server/node_modules
    command: npm run dev
    networks:
      - app-network

  mongo:
    image: mongo
    container_name: mongo
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${ROOT_USERNAME}"
      MONGO_INITDB_ROOT_PASSWORD: "${ROOT_PASSWORD}"
      MONGO_INITDB_DATABASE: mongodb
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network
      
  mongo-express:
    image: mongo-express
    restart: always
    container_name: mongo-express
    depends_on:
      - mongo
    ports:
      - 8081:8081
    environment:
        ME_CONFIG_MONGODB_SERVER: mongo
        ME_CONFIG_MONGODB_ADMINUSERNAME: "${MONGODB_ADMINUSERNAME}"
        ME_CONFIG_MONGODB_ADMINPASSWORD: "${MONGODB_ADMINPASSWORD}"
        ME_CONFIG_BASICAUTH: true
        ME_CONFIG_BASICAUTH_USERNAME: "${AUTH_USERNAME}"
        ME_CONFIG_BASICAUTH_PASSWORD: "${AUTH_PASSWORD}"
    networks:
      - app-network

volumes:
  front_node_modules:
  server_node_modules:
  mongo_data:

networks:
  app-network:
    driver: bridge